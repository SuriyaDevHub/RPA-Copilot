[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-copilot"
version = "0.1.0"
description = "Agentic AI support copilot for Genie Bot"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "openai>=1.30",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3]>=5.0",
    "respx>=0.21",
    "freezegun>=1.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genie_copilot = ["prompts/*.md"]
